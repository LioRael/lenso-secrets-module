[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-secrets",
    "crates/lenso-secrets-env-plugin",
    "crates/lenso-secrets-keychain-plugin",
    "crates/lenso-secrets-encrypted-file-plugin",
    "crates/lenso-secrets-command-plugin",
    "crates/lenso-secrets-link-smoke",
    "crates/lenso-secrets-link-set",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-secrets-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
age = "0.12.1"
lenso = { version = "0.5.7" }
lenso-app-plan = { version = "0.4.1" }
lenso-contract-runtime = { version = "0.2.0" }
lenso-kernel = { version = "0.3.3" }
lenso-native-adapter = { version = "0.3.5" }
lenso-plugin-authoring = { version = "0.2.0" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = "0.10.3"
tempfile = "3.23"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
