[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-secrets",
    "crates/lenso-secrets-env-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-secrets-module"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso-app-plan = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "d95e2240e83e9f4b90139a48ca97e067376f4fa9" }
lenso-contract-codegen = { version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-kernel = { version = "0.1.12", git = "https://github.com/LioRael/lenso", rev = "d95e2240e83e9f4b90139a48ca97e067376f4fa9" }
lenso-native-adapter = { version = "0.2.4", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6709c8dd02bfaf1cc83ca85f1446a91dc7069b8d" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
